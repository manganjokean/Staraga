<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Staraga — Star Fox Galaga</title>
<style>
  body { margin: 0; background: #050510; display: flex; justify-content: center; align-items: center; min-height: 100vh; font-family: 'Courier New', monospace; }
  #wrap { text-align: center; }
  canvas { background: #050510; border: 2px solid #335; box-shadow: 0 0 30px #224; }
  #hud { color: #8ff; margin-top: 8px; font-size: 14px; letter-spacing: 2px; }
  #menu, #settings {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    justify-content: center; align-items: center; gap: 16px;
    background: rgba(5,5,16,0.85); color: #8ff; z-index: 10;
  }
  #menu h1, #settings h2 { color: #ffe97a; margin: 0 0 10px; letter-spacing: 4px; text-shadow: 0 0 12px #fa0; }
  .mbtn {
    background: #112; color: #8ff; border: 2px solid #4af; padding: 12px 36px;
    font-family: inherit; font-size: 16px; letter-spacing: 3px; cursor: pointer; min-width: 220px;
  }
  .mbtn:hover { background: #4af; color: #112; }
  #settings label { display: flex; justify-content: space-between; width: 260px; font-size: 14px; }
  #settings select, #settings input { background: #112; color: #8ff; border: 1px solid #4af; font-family: inherit; }
  #stage { position: relative; display: inline-block; }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="game" width="480" height="640"></canvas>
    <div id="menu">
      <h1>STAR FOX GALAGA</h1>
      <button class="mbtn" id="startBtn">START GAME</button>
      <button class="mbtn" id="settingsBtn">SETTINGS</button>
    </div>
    <div id="settings" style="display:none;">
      <h2>SETTINGS</h2>
      <label>Difficulty <select id="difficulty"><option value="0.7">Easy</option><option value="1" selected>Normal</option><option value="1.4">Hard</option></select></label>
      <label>Lives <select id="livesSel"><option value="1">1</option><option value="3" selected>3</option><option value="5">5</option></select></label>
      <label>Player Speed <input id="speedSel" type="range" min="3" max="9" value="5"></label>
      <button class="mbtn" id="backBtn">BACK</button>
    </div>
  </div>
</div>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

const stars = Array.from({length: 80}, () => ({x: Math.random()*W, y: Math.random()*H, s: Math.random()*1.5+0.5}));

let keys = {};
let bullets = [], enemyBullets = [], enemies = [], explosions = [], powerups = [];
let score = 0, lives = 3, wave = 0, gameOver = false, waveTimer = 0;
let frame = 0, rapidUntil = 0, spreadUntil = 0, slowUntil = 0, shield = false;

const POWER_TYPES = [
  { type: 'rapid',  label: 'R', color: '#ffe97a', name: 'RAPID FIRE' },
  { type: 'spread', label: 'T', color: '#7af',    name: 'TRIPLE SHOT' },
  { type: 'shield', label: 'S', color: '#8f8',    name: 'SHIELD' },
  { type: 'slow',   label: 'Z', color: '#c8f',    name: 'SLOW TIME' },
];

const player = { x: W/2, y: H-60, w: 28, h: 20, cool: 0 };

// Enemy types styled after Star Fox characters
const TYPES = [
  { name: 'Slippy',   color: '#5ac85a', hp: 1, score: 100, label: 'SLIPPY', kind: 'frog' },
  { name: 'Peppy',    color: '#e8c39e', hp: 2, score: 200, label: 'PEPPY',  kind: 'human' },
  { name: 'Falco',    color: '#4a7bd5', hp: 1, score: 150, label: 'FALCO',  kind: 'bird' },
  { name: 'Fox',      color: '#e8862e', hp: 5, score: 1000, label: 'FOX',   kind: 'fox', boss: true },
];

function spawnWave() {
  wave++;
  enemies = [];
  const isBoss = wave % 3 === 0;
  const t = POWER_TYPES[Math.floor(Math.random() * POWER_TYPES.length)];
  powerups.push({ ...t, x: 60 + Math.random() * (W - 120), y: 30, vy: 1.5 });

  if (isBoss) {
    const t = TYPES[3];
    enemies.push({ ...t, x: W/2, y: 80, w: 60, h: 40, vx: 1.5, vy: 0, hp: t.hp + wave, t: 0 });
  } else {
    const cols = 6, rows = 3;
    for (let r = 0; r < rows; r++)
      for (let c = 0; c < cols; c++) {
        const t = TYPES[(r + wave) % 3];
        enemies.push({ ...t, x: 60 + c*70, y: 60 + r*50, w: 30, h: 22, vx: 1+wave*0.15, vy: 0, hp: t.hp, t: Math.random()*6.28, home: true });
      }
  }
}

function fire() {
  const rapid = frame < rapidUntil;
  if (frame < spreadUntil) {
    bullets.push({ x: player.x, y: player.y - 14, vy: -8, vx: -2 });
    bullets.push({ x: player.x, y: player.y - 14, vy: -8, vx: 0 });
    bullets.push({ x: player.x, y: player.y - 14, vy: -8, vx: 2 });
  } else {
    bullets.push({ x: player.x, y: player.y - 14, vy: -8, vx: 0 });
  }
  return rapid;
}

function explode(x, y, color) { explosions.push({x, y, r: 4, color, life: 20}); }

function update() {
  if (gameOver) return;
  if (!started) { stars.forEach(s => { s.y += s.s*1.5; if (s.y > H) { s.y = 0; s.x = Math.random()*W; } }); return; }
  stars.forEach(s => { s.y += s.s*1.5; if (s.y > H) { s.y = 0; s.x = Math.random()*W; } });

  if (keys['ArrowLeft'] || keys['a']) player.x -= speed;
  if (keys['ArrowRight'] || keys['d']) player.x += speed;
  if (keys['ArrowUp'] || keys['w']) player.y -= speed*0.8;
  if (keys['ArrowDown'] || keys['s']) player.y += speed*0.8;
  player.x = Math.max(16, Math.min(W-16, player.x));
  player.y = Math.max(H*0.55, Math.min(H-20, player.y));

  frame++;
  const slow = frame < slowUntil ? 0.5 : 1;
  if ((keys[' '] || keys['z']) && player.cool <= 0) {
    const rapid = fire();
    player.cool = rapid ? 5 : 12;
  }
  if (player.cool > 0) player.cool--;

  bullets.forEach(b => { b.y += b.vy; b.x += (b.vx || 0); });
  bullets = bullets.filter(b => b.y > -10);
  enemyBullets.forEach(b => b.y += b.vy * slow);
  enemyBullets = enemyBullets.filter(b => b.y < H+10);
  powerups.forEach(p => p.y += p.vy);
  powerups = powerups.filter(p => p.y < H + 20);
  powerups.forEach((p, i) => {
    if (Math.abs(p.x - player.x) < 18 && Math.abs(p.y - player.y) < 18) {
      powerups.splice(i, 1);
      if (p.type === 'rapid') rapidUntil = frame + 600;
      if (p.type === 'spread') spreadUntil = frame + 600;
      if (p.type === 'slow') slowUntil = frame + 600;
      if (p.type === 'shield') shield = true;
      explode(p.x, p.y, p.color);
    }
  });
  explosions.forEach(e => { e.r += 2; e.life--; });
  explosions = explosions.filter(e => e.life > 0);

  enemies.forEach(e => {
    e.t += 0.02;
    if (e.boss) { e.x += e.vx * slow; if (e.x < 60 || e.x > W-60) e.vx *= -1; if (Math.random() < 0.01 + wave*0.005) enemyBullets.push({x: e.x, y: e.y+30, vy: 3 + wave*0.3}); }
    else if (e.home) { e.x += e.vx * Math.cos(e.t) * slow; e.y += Math.sin(e.t*2)*0.4*slow; if (e.x < 30 || e.x > W-30) e.vx *= -1; if (Math.random() < 0.002 + wave*0.0005) e.dive = true; if (Math.random() < 0.003 * wave) enemyBullets.push({x: e.x, y: e.y+12, vy: 3 + wave*0.3}); }
    else if (e.dive) { e.y += 3*slow; e.x += Math.sin(e.t*3)*2*slow; if (Math.random() < 0.01 + wave*0.006) enemyBullets.push({x: e.x, y: e.y+12, vy: 4 + wave*0.3}); if (e.y > H-40) { e.dive = false; e.home = true; e.y = 60; } }
  });

  // bullet vs enemy
  bullets.forEach((b, bi) => enemies.forEach((e, ei) => {
    if (Math.abs(b.x - e.x) < e.w/2 && Math.abs(b.y - e.y) < e.h/2) {
      bullets.splice(bi,1); e.hp--;
      if (e.hp <= 0) { explode(e.x, e.y, e.color); score += e.score; enemies.splice(ei,1); }
      else explode(b.x, b.y, '#fff');
    }
  }));
  // enemy bullet vs player
  enemyBullets.forEach((b, bi) => {
    if (Math.abs(b.x - player.x) < 14 && Math.abs(b.y - player.y) < 12) {
      enemyBullets.splice(bi,1);
      if (shield) { shield = false; explode(player.x, player.y, '#8f8'); }
      else { explode(player.x, player.y, '#6cf'); lives--; if (lives <= 0) gameOver = true; }
    }
  });
  // enemy dive into player
  enemies.forEach(e => {
    if (e.dive && Math.abs(e.x-player.x) < 16 && Math.abs(e.y-player.y) < 16) {
      if (shield) { shield = false; explode(player.x, player.y, '#8f8'); }
      else { explode(player.x, player.y, '#6cf'); lives--; if (lives <= 0) gameOver = true; }
    }
  });

  if (started && !gameOver && enemies.length === 0) { waveTimer++; if (waveTimer > 60) { spawnWave(); waveTimer = 0; } }
}

function sprite(x, y, w, h, e) {
  const r = w / 2;
  ctx.save(); ctx.translate(x, y);
  ctx.fillStyle = e.color;
  switch (e.kind) {
    case 'frog': // Slippy: round green head, big white eyes on top
      ctx.beginPath(); ctx.arc(0, 2, r*0.8, 0, 6.28); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(-r*0.4, -r*0.6, r*0.3, 0, 6.28); ctx.arc(r*0.4, -r*0.6, r*0.3, 0, 6.28); ctx.fill();
      ctx.fillStyle = '#222';
      ctx.beginPath(); ctx.arc(-r*0.4, -r*0.6, r*0.13, 0, 6.28); ctx.arc(r*0.4, -r*0.6, r*0.13, 0, 6.28); ctx.fill();
      break;
    case 'human': // Peppy: bald head + face
      ctx.beginPath(); ctx.arc(0, 0, r*0.75, 0, 6.28); ctx.fill();
      ctx.fillStyle = '#333'; ctx.fillRect(-r*0.5, -r*0.15, r*1.0, r*0.1); // visor-ish eyes
      ctx.strokeStyle = '#a33'; ctx.beginPath(); ctx.arc(0, r*0.3, r*0.3, 0.2, Math.PI-0.2); ctx.stroke();
      break;
    case 'bird': // Falco: blue head, orange beak, white face mask
      ctx.beginPath(); ctx.arc(0, 0, r*0.8, 0, 6.28); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.ellipse(0, -r*0.1, r*0.6, r*0.45, 0, 0, 6.28); ctx.fill();
      ctx.fillStyle = '#f80';
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(r*0.7, r*0.2); ctx.lineTo(0, r*0.4); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#222'; ctx.fillRect(-r*0.35, -r*0.2, r*0.22, r*0.12); ctx.fillRect(r*0.15, -r*0.2, r*0.22, r*0.12);
      break;
    case 'fox': // Fox: orange fox head with pointy ears
      ctx.beginPath(); ctx.moveTo(-r*0.7, -r*0.3); ctx.lineTo(-r*0.9, -r*1.1); ctx.lineTo(-r*0.2, -r*0.6); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(r*0.7, -r*0.3); ctx.lineTo(r*0.9, -r*1.1); ctx.lineTo(r*0.2, -r*0.6); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.arc(0, 0, r*0.8, 0, 6.28); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.ellipse(0, r*0.25, r*0.5, r*0.35, 0, 0, 6.28); ctx.fill();
      ctx.fillStyle = '#222'; ctx.fillRect(-r*0.4, -r*0.25, r*0.25, r*0.12); ctx.fillRect(r*0.15, -r*0.25, r*0.25, r*0.12);
      ctx.beginPath(); ctx.arc(0, r*0.15, r*0.12, 0, 6.28); ctx.fill();
      break;
  }
  ctx.restore();
  ctx.fillStyle = 'rgba(255,255,255,0.7)'; ctx.font = '8px monospace'; ctx.textAlign = 'center';
  ctx.fillText(e.label, x, y - r - 8);
}

function draw() {
  ctx.fillStyle = '#050510'; ctx.fillRect(0,0,W,H);
  ctx.fillStyle = '#fff';
  stars.forEach(s => ctx.fillRect(s.x, s.y, s.s, s.s));
  enemies.forEach(e => sprite(e.x, e.y, e.w, e.h, e));
  // Galaga-style player fighter
  ctx.fillStyle = '#e8e8f0';
  ctx.beginPath();
  ctx.moveTo(player.x, player.y - 14); ctx.lineTo(player.x + 16, player.y + 10); ctx.lineTo(player.x + 10, player.y + 6);
  ctx.lineTo(player.x + 5, player.y + 10); ctx.lineTo(player.x, player.y + 6);
  ctx.lineTo(player.x - 5, player.y + 10); ctx.lineTo(player.x - 10, player.y + 6); ctx.lineTo(player.x - 16, player.y + 10);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#c33'; ctx.beginPath(); ctx.ellipse(player.x, player.y - 2, 3, 6, 0, 0, 6.28); ctx.fill();
  ctx.fillStyle = '#3af'; ctx.fillRect(player.x - 15, player.y + 6, 5, 3); ctx.fillRect(player.x + 10, player.y + 6, 5, 3);

  ctx.fillStyle = '#8ff'; bullets.forEach(b => ctx.fillRect(b.x-2, b.y-8, 4, 10));
  ctx.fillStyle = '#f66'; enemyBullets.forEach(b => ctx.fillRect(b.x-2, b.y-4, 4, 8));
  powerups.forEach(p => {
    ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, 9, 0, 6.28); ctx.fill();
    ctx.fillStyle = '#112'; ctx.font = 'bold 11px monospace'; ctx.textAlign = 'center'; ctx.fillText(p.label, p.x, p.y + 4);
  });
  if (shield) { ctx.strokeStyle = '#8f8'; ctx.beginPath(); ctx.arc(player.x, player.y, 20, 0, 6.28); ctx.stroke(); }
  explosions.forEach(e => { ctx.strokeStyle = e.color; ctx.beginPath(); ctx.arc(e.x, e.y, e.r, 0, 6.28); ctx.stroke(); });

  ctx.fillStyle = '#8ff'; ctx.font = '14px monospace'; ctx.textAlign = 'left';
  ctx.fillText(`SCORE ${score}`, 10, 20);
  ctx.fillText(`LIVES ${lives}`, 10, 40);
  ctx.textAlign = 'right'; ctx.fillText(`WAVE ${wave}`, W-10, 20);
  if (wave === 0) { ctx.textAlign='center'; ctx.fillStyle='#ffe97a'; ctx.font='20px monospace'; ctx.fillText('STAR FOX GALAGA', W/2, H/2 - 20); ctx.fillStyle='#8ff'; ctx.font='12px monospace'; ctx.fillText('Arrows/WASD move, SPACE fire — press SPACE to start', W/2, H/2+10); }
  if (gameOver) {
  ctx.fillStyle = 'rgba(5,5,16,0.75)'; ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';
  ctx.fillStyle='#f66'; ctx.font='32px monospace'; ctx.fillText('GAME OVER', W/2, H/2 - 50);
  ctx.fillStyle='#ffe97a'; ctx.font='16px monospace'; ctx.fillText(`SCORE: ${score}`, W/2, H/2 - 10);
  ctx.fillText(`WAVE REACHED: ${wave}`, W/2, H/2 + 16);
  ctx.fillStyle='#8ff'; ctx.font='13px monospace';
  ctx.fillText('Press R to restart', W/2, H/2 + 56);
  ctx.fillText('Press M for menu', W/2, H/2 + 78);
}
}

let started = false;
let speed = 5, difficulty = 1;
addEventListener('keydown', e => { keys[e.key] = true; if (e.key === ' ') e.preventDefault(); if (gameOver && (e.key === 'm' || e.key === 'M')) { started = false; gameOver = false; enemies = []; menuEl.style.display = 'flex'; } });
addEventListener('keydown', e => {
  if (gameOver && (e.key === 'r' || e.key === 'R')) {
    score = 0; wave = 0; gameOver = false; bullets = []; enemyBullets = []; explosions = []; enemies = []; powerups = []; waveTimer = 0;
    rapidUntil = 0; spreadUntil = 0; slowUntil = 0; shield = false; frame = 0;
    player.x = W/2; player.y = H-60;
    started = true; spawnWave();
  }
});

const menuEl = document.getElementById('menu'), settingsEl = document.getElementById('settings');
document.getElementById('startBtn').onclick = () => {
  difficulty = parseFloat(document.getElementById('difficulty').value);
  lives = parseInt(document.getElementById('livesSel').value);
  speed = parseInt(document.getElementById('speedSel').value);
  score = 0; wave = 0; gameOver = false; bullets = []; enemyBullets = []; explosions = []; enemies = []; powerups = []; waveTimer = 0;
  rapidUntil = 0; spreadUntil = 0; slowUntil = 0; shield = false; frame = 0;
  player.x = W/2; player.y = H-60;
  menuEl.style.display = 'none'; settingsEl.style.display = 'none';
  started = true; spawnWave();
};
document.getElementById('settingsBtn').onclick = () => { menuEl.style.display = 'none'; settingsEl.style.display = 'flex'; };
document.getElementById('backBtn').onclick = () => { settingsEl.style.display = 'none'; menuEl.style.display = 'flex'; };

// apply speed multiplier to enemy motion/fire
const origSpawn = spawnWave;
spawnWave = function() { origSpawn(); enemies.forEach(e => { e.vx *= difficulty; }); };
addEventListener('keyup', e => keys[e.key] = false);

(function loop() { update(); draw(); requestAnimationFrame(loop); })();
</script>
</body>
</html>
